<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c39"><title>Carnet de grimpe</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Carnet de grimpe"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#203a36;background:#edf3ef}*{box-sizing:border-box}body{margin:0}header{background:#173c39;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:1.3rem}header small{color:#b8d8c8}.wrap{max-width:1120px;margin:22px auto;padding:0 15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,.button{border:0;border-radius:10px;padding:10px 13px;background:#d9e8df;color:#173c39;font-weight:650;cursor:pointer}button.primary,.tabs .active{background:#20715d;color:white}button.warn{background:#fce0d9;color:#9b3323}button:disabled{opacity:.5;cursor:not-allowed}.card{background:white;border:1px solid #dbe5df;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 3px 15px #1c43380a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.muted{color:#637971}.badge{display:inline-block;background:#e6f1e9;border-radius:40px;padding:4px 10px;font-size:.8rem}.pending{background:#fff2d1}.rejected{background:#ffe2de}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;flex:1;min-width:160px}input,select{font:inherit;padding:10px;border:1px solid #b8cec2;border-radius:9px;width:100%;background:white}label{font-weight:600;font-size:.92rem}h2{margin:0 0 14px}h3{margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:.91rem}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #e7eee9}th{color:#637971}.scroll{overflow-x:auto}.stat{font-size:1.7rem;font-weight:800;color:#20715d}.tiny{font-size:.78rem}.note{background:#fff5df;border-left:4px solid #d89a30;padding:12px;border-radius:8px}.bar{height:9px;border-radius:8px;background:#e4ece7;overflow:hidden}.bar>span{display:block;height:100%;background:#4eaa80}.hidden{display:none!important}footer{padding:25px;text-align:center;color:#71837b;font-size:.8rem}@media(max-width:600px){header{align-items:flex-start}table{font-size:.8rem}th,td{padding:8px 5px}}

/* Niveaux de maîtrise : 1 rouge, 2 jaune, 3 vert, 4 vert foncé */
.mastery{display:inline-block;border-radius:8px;padding:5px 9px;font-weight:650;font-size:.82rem}
.mastery-0{background:#edf0f2;color:#42515a}.mastery-1{background:#fbd6d6;color:#8b1717}.mastery-2{background:#fff0ad;color:#755300}.mastery-3{background:#c7efd1;color:#155c2d}.mastery-4{background:#17663c;color:white}
select.mastery-1{background:#fbd6d6;color:#8b1717}select.mastery-2{background:#fff0ad;color:#755300}select.mastery-3{background:#c7efd1;color:#155c2d}select.mastery-4{background:#17663c;color:white}
details.fold{background:#f7faf8;border:1px solid #dce9e0;border-radius:12px;margin:9px 0;padding:10px 12px}

.teacherPanelTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;flex-wrap:nowrap}.teacherPanelTitle .panelControls{margin-left:auto;display:inline-flex;flex:none;gap:5px}.panelControls button{min-width:36px;padding:7px 10px;line-height:1.1}.teacherGroup{margin-bottom:15px}.teacherGroupHeading{font-weight:750;font-size:1.05rem;margin:0 0 10px;display:flex;align-items:center}.teacherGroup>.grid{margin:0}.teacherGroup>.grid>.card{margin-bottom:0}@media(max-width:600px){.teacherPanelTitle{font-size:1.1rem}.panelControls button{min-width:34px;padding:6px 8px}}

@media (max-width:430px){.grid:has(.sessionDate){grid-template-columns:minmax(0,1fr)}}
</style></head><body><header><div><h1>⛰ Carnet de grimpe</h1><small>Escalade · 3e · suivi des ascensions et des compétences</small></div><span id="modeLabel" class="badge">Mode élève</span></header><main class="wrap"><nav class="tabs"><button data-tab="eleve" class="active">🧗 Élève</button><button data-tab="prof">🧭 Professeur</button></nav><div id="content"></div></main><footer>Données enregistrées sur cet appareil · Effectuer régulièrement une sauvegarde</footer><script>
const KEY='grimpe-v1';const grades=['4B','4B+','4C','4C+','5A','5A+','5B','5B+','5C','5C+','6A','6A+','6B'];const domains={securite:['Contrôler son équipement','Effectuer le contrôle croisé','Assurer avec le GriGri selon le protocole','Communiquer et gérer la descente'],motricite:['Pousser sur les jambes','Placer précisément les pieds','Maintenir son équilibre','Grimper avec continuité'],lecture:['Repérer les prises avant de partir','Anticiper les passages difficiles','Adapter son itinéraire','Choisir une voie adaptée'],responsabilite:['Tenir son rôle dans la cordée','Observer utilement un partenaire','Donner un conseil précis','Respecter les zones de sécurité']};
const defaultDomains=()=>Object.fromEntries(Object.entries(domains).map(([k,v])=>[k,v.map((label,i)=>({id:k+'-'+i,label}))]));const starter=()=>({version:1,pin:'',students:[],routes:[{id:'A01',sector:'Gauche',grade:'4B',color:'Verte',active:true},{id:'A02',sector:'Gauche',grade:'5A',color:'Bleue',active:true},{id:'B01',sector:'Centre',grade:'5B',color:'Rouge',active:true},{id:'C01',sector:'Droite',grade:'6A',color:'Jaune',active:true}],ascents:[],skills:{},session:1,classes:[{id:'classe-1',name:'3e A'}],activeClassId:'classe-1',skillCatalog:defaultDomains(),sessionDates:{}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||starter()}catch{db=starter()}if(!Array.isArray(db.classes)||!db.classes.length){db.classes=[{id:'classe-1',name:'3e A'}];db.activeClassId='classe-1';db.students.forEach(x=>x.classId='classe-1');db.ascents.forEach(x=>x.classId='classe-1')}db.skillCatalog??=defaultDomains();db.sessionDates??={};if(!db.classes.some(c=>c.id===db.activeClassId))db.activeClassId=db.classes[0].id;db.students.forEach(x=>x.classId??=db.classes[0].id);db.ascents.forEach(a=>a.classId??=getClassForStudent(a.studentId));function getClassForStudent(id){return db.students.find(x=>x.id===id)?.classId||db.classes[0].id}let tab='eleve',prof=false,studentId='',filter='pending';const el=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Stockage indisponible : exportez une sauvegarde.')}};const gradeVal=g=>grades.indexOf(g);const gradeAvg=arr=>arr.length?grades[Math.round(arr.reduce((a,x)=>a+gradeVal(x),0)/arr.length)]:'—';const currentClass=()=>db.classes.find(c=>c.id===db.activeClassId);const classStudents=()=>db.students.filter(x=>x.classId===db.activeClassId);const classAscents=()=>db.ascents.filter(a=>a.classId===db.activeClassId);const getStudent=id=>db.students.find(x=>x.id===id);const getRoute=id=>db.routes.find(x=>x.id===id);const statusName={pending:'En attente',validated:'Validée',rejected:'Rejetée'};const outcomeName={attempt:'Tentative inachevée',rest:'Réussie avec repos',clean:'Réussie sans repos'};function setTab(t){if(t==='eleve')prof=false;tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));const masteryNames=['Non évalué','Non maîtrisé','Maîtrise fragile','Maîtrise satisfaisante','Très bonne maîtrise'];
// Older saves used 0..3: map 1..3 to 1,3,4, so a prior mastered skill stays mastered.
if(!db.masteryScaleVersion){for(const record of Object.values(db.skills||{})){for(const v of Object.values(record||{})){if(typeof v.self==='number')v.self=({0:0,1:1,2:3,3:4})[v.self]??0;if(typeof v.teacher==='number')v.teacher=({0:0,1:1,2:3,3:4})[v.teacher]??0}}db.masteryScaleVersion=2;save()}
function colorizeSkillSelects(){document.querySelectorAll('.selfSkill,.teacherSkill').forEach(x=>{x.className=x.className.replace(/mastery-\d/g,'').trim()+' mastery-'+x.value;x.addEventListener('change',()=>{x.className=x.className.replace(/mastery-\d/g,'').trim()+' mastery-'+x.value})})}
function foldCards(){document.querySelectorAll('#content section.card').forEach(card=>{const h=card.querySelector(':scope > h2, :scope > h3');if(!h||/Mon carnet|Classe active|Enregistrer une ascension|Compétences :|Accès professeur/.test(h.textContent))return;const detail=document.createElement('details');detail.className='fold';detail.open=/Séance active|Ascensions à valider/.test(h.textContent);const summary=document.createElement('summary');summary.textContent=h.textContent;detail.append(summary);h.remove();while(card.firstChild)detail.append(card.firstChild);card.append(detail)})}
function foldState(){const state={};document.querySelectorAll('#content details').forEach((d,i)=>{const label=d.querySelector(':scope > summary')?.textContent?.trim()||'';const key=label+'#'+Array.from(document.querySelectorAll('#content details')).slice(0,i).filter(x=>x.querySelector(':scope > summary')?.textContent?.trim()===label).length;state[key]=d.open});return state}
function restoreFolds(state){document.querySelectorAll('#content details').forEach((d,i)=>{const label=d.querySelector(':scope > summary')?.textContent?.trim()||'';const key=label+'#'+Array.from(document.querySelectorAll('#content details')).slice(0,i).filter(x=>x.querySelector(':scope > summary')?.textContent?.trim()===label).length;if(Object.hasOwn(state,key))d.open=state[key]})}
function render(){const prior=foldState();document.getElementById('modeLabel').textContent=prof?'Mode professeur déverrouillé':'Mode élève';el.innerHTML=tab==='eleve'?studentView():prof?teacherView():loginView();foldCards();restoreFolds(prior);bind();colorizeSkillSelects();setupRestInput();if(prof&&tab==='prof')setupTeacherOrder()}

function setupRestInput(){const outcome=document.getElementById('outcome'),rests=document.getElementById('restsInput');if(!outcome||!rests)return;function sync(){const clean=outcome.value==='clean';if(clean)rests.value=0;rests.disabled=clean;rests.title=clean?'Une réussite sans repos implique zéro repos':''}outcome.addEventListener('change',sync);sync()}
function setupTeacherOrder(){
 const root=document.getElementById('content');
 const nodes=[...root.children].filter(n=>n.matches('section.card,div.grid'));
 if(!nodes.length)return;
 // Each grid is treated as one indivisible panel, so its tiles cannot spill into other panels.
 nodes.forEach((node,i)=>{
   if(node.matches('div.grid')){
     const wrap=document.createElement('section');wrap.className='teacherGroup';
     node.before(wrap);wrap.appendChild(node);
     wrap.dataset.panelKey=i===5?'indicateurs':i===7?'profils-voies':'groupe-'+i;
   }else{
     const h=node.querySelector(':scope > h2');
     node.dataset.panelKey=node.id||'p-'+i;
     if(h)h.classList.add('teacherPanelTitle');
   }
 });
 const panels=[...root.children].filter(n=>n.dataset.panelKey);
 db.teacherPanelOrder??=[];
 panels.sort((a,b)=>{
   const ai=db.teacherPanelOrder.indexOf(a.dataset.panelKey),bi=db.teacherPanelOrder.indexOf(b.dataset.panelKey);
   return (ai<0?999:ai)-(bi<0?999:bi);
 }).forEach(n=>root.appendChild(n));
 const labels={'indicateurs':'📊 Indicateurs','profils-voies':'👥 Profils et voies'};
 function refresh(){
   const ordered=[...root.children].filter(n=>n.dataset.panelKey);
   ordered.forEach((node,i)=>{
     let heading=node.querySelector(':scope > h2');
     if(!heading){heading=node.querySelector(':scope > .teacherGroupHeading');
       if(!heading){heading=document.createElement('div');heading.className='teacherGroupHeading';node.prepend(heading)}
       heading.textContent=labels[node.dataset.panelKey]||'Panneau';
     }
     heading.classList.add('teacherPanelTitle');
     let controls=heading.querySelector('.panelControls');
     if(!controls){controls=document.createElement('span');controls.className='panelControls';heading.appendChild(controls)}
     controls.replaceChildren();
     const up=document.createElement('button');up.type='button';up.textContent='↑';up.title='Monter ce volet';up.setAttribute('aria-label','Monter ce volet');up.disabled=i===0;
     const down=document.createElement('button');down.type='button';down.textContent='↓';down.title='Descendre ce volet';down.setAttribute('aria-label','Descendre ce volet');down.disabled=i===ordered.length-1;
     up.onclick=()=>move(node,-1);down.onclick=()=>move(node,1);
     controls.append(up,down);
   });
 }
 function move(node,d){
   const ordered=[...root.children].filter(n=>n.dataset.panelKey);
   const i=ordered.indexOf(node),target=ordered[i+d];if(!target)return;
   if(d<0)root.insertBefore(node,target);else root.insertBefore(target,node);
   db.teacherPanelOrder=[...root.children].filter(n=>n.dataset.panelKey).map(n=>n.dataset.panelKey);
   save();refresh();
 }
 refresh();
}
function studentView(){let s=getStudent(studentId);let as=classAscents().filter(a=>a.studentId===studentId);let valid=as.filter(a=>a.status==='validated');let success=valid.filter(a=>a.outcome!=='attempt');let clean=valid.filter(a=>a.outcome==='clean');let top=clean.length?grades[Math.max(...clean.map(a=>gradeVal(a.grade)))]: '—';let options=classStudents().map(x=>`<option value="${esc(x.id)}" ${studentId===x.id?'selected':''}>${esc(x.name)}</option>`).join('');let routeOptions=db.routes.filter(x=>x.active).map(r=>`<option value="${esc(r.id)}">${esc(r.id)} · ${esc(r.grade)} · ${esc(r.color)} · ${esc(r.sector)}</option>`).join('');return `<section class="card"><h2>Mon carnet · ${esc(currentClass()?.name)}</h2><div class="row"><div class="field"><label>Choisir mon profil</label><select id="student"><option value="">— Sélectionner —</option>${options}</select></div></div>${!classStudents().length?'<p class="note">Le professeur doit commencer par créer les profils élèves.</p>':''}</section><section class="card"><h3>🏔 Défi interclasses · derniers bilans</h3>${classChallenge()}</section>${s?`<div class="grid"><section class="card"><div class="muted">Ascensions validées</div><div class="stat">${valid.length}</div></section><section class="card"><div class="muted">Réussites sans repos</div><div class="stat">${clean.length}</div></section><section class="card"><div class="muted">Meilleure cotation sans repos</div><div class="stat">${top}</div></section><section class="card"><div class="muted">Cotation moyenne réussie</div><div class="stat">${gradeAvg(success.map(a=>a.grade))}</div></section></div><section class="card"><h2>➕ Enregistrer une ascension</h2><form id="ascentForm"><div class="row"><div class="field"><label>Séance en cours</label><div class="badge">S${db.session}${db.sessionDates[db.activeClassId]?.[db.session]?' · '+esc(db.sessionDates[db.activeClassId][db.session]):''}</div></div><div class="field"><label>Voie</label><select name="routeId" required>${routeOptions}</select></div></div><div class="row"><div class="field"><label>Résultat</label><select name="outcome" id="outcome"><option value="attempt">Tentative inachevée</option><option value="rest">Réussie avec repos</option><option value="clean">Réussie sans repos</option></select></div><div class="field"><label>Nombre de repos sur corde</label><input name="rests" id="restsInput" type="number" min="0" max="30" value="0"></div></div><button class="primary" ${!routeOptions?'disabled':''}>Enregistrer (en attente de validation)</button></form></section><section class="card"><h2>Mes compétences</h2><p class="muted tiny">Autoévaluation indicative. Seule l'évaluation professeur fait foi, notamment pour l'assurage.</p>${Object.entries(db.skillCatalog).filter(([d,items])=>items.some(item=>item.visible!==false)).map(([d,items])=>`<details class="fold"><summary>${esc(d[0].toUpperCase()+d.slice(1))}</summary>${items.filter(item=>item.visible!==false).map((item,i)=>{let k=item.id,v=db.skills[studentId]?.[k]||{};return `<div class="row" style="margin-bottom:10px"><span style="flex:2;min-width:190px">${esc(item.label)}</span><select class="selfSkill mastery-${v.self||0}" data-key="${k}" style="flex:1;min-width:135px"><option value="0" ${!v.self?'selected':''}>Non évalué</option>${masteryNames.slice(1).map((n,j)=>`<option value="${j+1}" ${v.self==j+1?'selected':''}>${n}</option>`).join('')}</select><span class="mastery mastery-${v.teacher||0}">Prof : ${masteryNames[v.teacher||0]}</span></div>`}).join('')}</details>`).join('')}</section><section class="card"><h2>Historique</h2>${ascentTable(as.slice().reverse(),false)}</section>`:''}`}
function ascentTable(items,actions){return `<div class="scroll"><table><thead><tr><th>Séance</th>${actions?'<th>Élève</th>':''}<th>Voie</th><th>Résultat</th><th>Statut</th>${actions?'<th>Actions</th>':''}</tr></thead><tbody>${items.map(a=>`<tr><td>S${a.session}</td>${actions?`<td>${esc(getStudent(a.studentId)?.name||'Profil supprimé')}</td>`:''}<td>${esc(a.routeId)} · ${esc(a.grade)}</td><td>${esc(outcomeName[a.outcome])}${a.rests?` (${a.rests} repos)`:''}</td><td><span class="badge ${a.status==='pending'?'pending':a.status==='rejected'?'rejected':''}">${statusName[a.status]}</span></td>${actions?`<td><div class="row"><button data-act="validate" data-id="${a.id}">✓</button><button data-act="reject" data-id="${a.id}">Rejeter</button><button data-act="edit" data-id="${a.id}">Modifier</button><button class="warn" data-act="delete" data-id="${a.id}">Suppr.</button></div></td>`:''}</tr>`).join('')||`<tr><td colspan="${actions?6:4}" class="muted">Aucune ascension</td></tr>`}</tbody></table></div>`}
function loginView(){return `<section class="card"><h2>🔐 Accès professeur</h2><p class="muted">Le code protège l'interface contre les manipulations ordinaires ; ce n'est pas une authentification sécurisée.</p><form id="loginForm"><div class="field"><label>${db.pin?'Code PIN professeur':'Créer un code PIN professeur (4 chiffres minimum)'}</label><input id="pin" type="password" inputmode="numeric" minlength="4" required></div><button class="primary">${db.pin?'Déverrouiller':'Créer le code et accéder'}</button></form></section>`}
function teacherView(){let pending=classAscents().filter(a=>a.status==='pending').length;let valid=classAscents().filter(a=>a.status==='validated');let filtered=classAscents().filter(a=>filter==='all'||a.status===filter).slice().reverse();return `<section class="card"><h2>🏫 Classe active : ${esc(currentClass()?.name)}</h2><p class="muted">Le changement de classe est réservé au mode professeur. Les élèves ne voient que les profils de la classe active.</p><div class="row"><div class="field"><label>Changer de classe</label><select id="classSelect">${db.classes.map(c=>`<option value="${esc(c.id)}" ${c.id===db.activeClassId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><button id="renameClass">Renommer</button><button class="warn" id="deleteClass">Supprimer</button><form id="classForm" class="row" style="flex:2"><div class="field"><label>Nouvelle classe</label><input name="name" maxlength="40" placeholder="3e B" required></div><button class="primary">Ajouter</button></form></div></section><section class="card"><h2>📅 Séance active et calendrier</h2><p class="muted">Seul le professeur choisit la séance active. Les élèves ne peuvent enregistrer que sur cette séance.</p><div class="row"><div class="field"><label>Séance active</label><select id="activeSession">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${db.session===i+1?'selected':''}>S${i+1}</option>`).join('')}</select></div></div><div class="grid">${Array.from({length:8},(_,i)=>`<div class="field"><label>Date S${i+1}</label><input type="date" class="sessionDate" data-session="${i+1}" value="${esc(db.sessionDates[db.activeClassId]?.[i+1]||'')}"></div>`).join('')}</div></section><section class="card"><h2>🎯 Catalogue des compétences</h2><p class="muted tiny">Les nouvelles compétences sont masquées aux élèves par défaut. Utilisez « Afficher / Masquer » pour les dévoiler progressivement. Les évaluations déjà saisies restent liées à leur identifiant, même si le libellé est modifié.</p><form id="categoryForm" class="row"><div class="field"><label>Nouvelle catégorie</label><input name="category" maxlength="60" required placeholder="Ex. Gestion de l'effort"></div><button>Ajouter la catégorie</button></form><form id="skillAddForm" class="row"><div class="field"><label>Catégorie</label><select name="category">${Object.keys(db.skillCatalog).map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}</select></div><div class="field"><label>Nouvelle compétence</label><input name="label" maxlength="150" required></div><button class="primary">Ajouter la compétence</button></form><details class="fold" id="allSkillsFold"><summary>Afficher / masquer toutes les compétences (${Object.values(db.skillCatalog).reduce((n,items)=>n+items.length,0)})</summary>${Object.entries(db.skillCatalog).map(([k,items])=>`<div class="skillCategory"><h3>${esc(k)}</h3><div><button data-renamecategory="${esc(k)}">Renommer</button> <button class="warn" data-deletecategory="${esc(k)}">Supprimer</button></div><div class="scroll"><table>${items.map(it=>`<tr><td>${esc(it.label)}</td><td><button data-toggleskill="${esc(it.id)}">${it.visible===false?'🔒 Masquée · afficher':'👁 Visible · masquer'}</button> <button data-editskill="${esc(it.id)}">Modifier</button> <button class="warn" data-deleteskill="${esc(it.id)}">Supprimer</button></td></tr>`).join('')}</table></div></div>`).join('')}</details></section><section class="card"><h2>📊 Bilan de séance</h2><div class="row"><div class="field"><label>Séance analysée</label><select id="reportSession">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${db.reportSession==i+1?'selected':''}>Séance ${i+1}</option>`).join('')}</select></div></div><div id="sessionReport">${sessionReport(db.activeClassId,db.reportSession||db.session)}</div></section><section class="card"><h2>🏔 Défi interclasses (bilans anonymes)</h2><p class="muted tiny">Comparaison des ascensions validées uniquement. Aucun nom d'élève n'est affiché.</p><div id="classChallenge">${classChallenge()}</div></section><div class="grid"><section class="card"><div class="muted">Élèves</div><div class="stat">${classStudents().length}</div></section><section class="card"><div class="muted">Ascensions à valider</div><div class="stat">${pending}</div></section><section class="card"><div class="muted">Ascensions validées</div><div class="stat">${valid.length}</div></section><section class="card"><div class="muted">Voies actives</div><div class="stat">${db.routes.filter(r=>r.active).length}</div></section></div><section class="card"><h2>Validation des ascensions</h2><div class="row" style="margin-bottom:12px"><label>Afficher</label><select id="filter" style="max-width:220px"><option value="pending" ${filter==='pending'?'selected':''}>En attente</option><option value="all" ${filter==='all'?'selected':''}>Toutes</option><option value="validated" ${filter==='validated'?'selected':''}>Validées</option><option value="rejected" ${filter==='rejected'?'selected':''}>Rejetées</option></select></div>${ascentTable(filtered,true)}</section><div class="grid"><section class="card"><h2>Profils élèves</h2><form id="studentForm" class="row"><div class="field"><label>Prénom ou pseudonyme</label><input name="name" maxlength="40" required></div><button class="primary">Ajouter</button></form><div class="scroll"><table>${classStudents().map(s=>`<tr><td>${esc(s.name)}</td><td><button data-student="${s.id}">Compétences</button></td></tr>`).join('')}</table></div></section><section class="card"><h2>Catalogue des voies</h2><form id="routeForm"><div class="row"><div class="field"><label>Identifiant unique</label><input name="id" placeholder="A03" required></div><div class="field"><label>Cotation</label><select name="grade">${grades.map(g=>`<option>${g}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Secteur</label><input name="sector" required></div><div class="field"><label>Couleur</label><input name="color" required></div></div><button class="primary">Créer une voie</button></form><div class="scroll"><table>${db.routes.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.grade)}</td><td>${esc(r.color)}</td><td><button data-editroute="${esc(r.id)}">Modifier</button> <button data-route="${esc(r.id)}">${r.active?'Archiver':'Réactiver'}</button></td></tr>`).join('')}</table></div></section></div><section class="card"><h2>Réglages et sauvegardes</h2><div class="row"><div class="field"><label>Séance active (rappel)</label><select id="session">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${db.session===i+1?'selected':''}>S${i+1}</option>`).join('')}</select></div><div class="field"><label>Importer une sauvegarde JSON</label><input id="import" type="file" accept="application/json,.json"></div></div><div class="row"><button class="primary" id="export">⬇ Exporter la sauvegarde JSON</button><button id="csv">⬇ Exporter les ascensions CSV</button><button id="excel">📊 Exporter le classeur Excel</button><button id="lock">Verrouiller le mode professeur</button></div><p class="note">Sauvegarder après chaque séance. Le stockage local peut être supprimé par le navigateur ou la gestion de l'appareil. Éviter les noms complets et ne pas partager les exports contenant des données d'élèves.</p></section><section class="card" id="skillPanel"><h2>Évaluation professeur</h2><p class="muted">Choisir « Compétences » à côté d'un élève.</p></section>`}
function bind(){document.getElementById('student')?.addEventListener('change',e=>{studentId=e.target.value;render()});document.getElementById('ascentForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),r=getRoute(f.get('routeId'));if(!r)return;let outcome=f.get('outcome'),rests=Number(f.get('rests'));if(outcome==='clean')rests=0;if(outcome==='rest'&&rests<1)return alert('Indiquer au moins un repos.');db.ascents.push({id:uid(),classId:db.activeClassId,studentId,routeId:r.id,grade:r.grade,session:db.session,outcome,rests,status:'pending',createdAt:new Date().toISOString()});save();render();alert('Ascension enregistrée, en attente de validation.')});document.querySelectorAll('.selfSkill').forEach(e=>e.onchange=()=>{db.skills[studentId]??={};db.skills[studentId][e.dataset.key]??={};db.skills[studentId][e.dataset.key].self=Number(e.value);save()});document.getElementById('loginForm')?.addEventListener('submit',e=>{e.preventDefault();let pin=document.getElementById('pin').value;if(!db.pin){if(pin.length<4)return;db.pin=pin;save();prof=true}else if(pin===db.pin)prof=true;else return alert('Code incorrect.');render()});document.getElementById('filter')?.addEventListener('change',e=>{filter=e.target.value;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let a=db.ascents.find(x=>x.id===b.dataset.id);if(!a)return;let act=b.dataset.act;if(act==='validate')a.status='validated';if(act==='reject')a.status='rejected';if(act==='delete'){if(!confirm('Supprimer définitivement cette ascension ?'))return;db.ascents=db.ascents.filter(x=>x.id!==a.id)}if(act==='edit'){let route=prompt('Identifiant de voie',a.routeId);if(route===null)return;let r=getRoute(route.trim());if(!r)return alert('Voie inconnue.');let outcome=prompt('Résultat : attempt, rest ou clean',a.outcome);if(!['attempt','rest','clean'].includes(outcome))return alert('Résultat invalide.');let rests=Number(prompt('Nombre de repos',a.rests));if(!Number.isInteger(rests)||rests<0)return alert('Nombre invalide.');a.routeId=r.id;a.grade=r.grade;a.outcome=outcome;a.rests=outcome==='clean'?0:rests;a.status='pending'}save();render()});document.getElementById('renameClass')?.addEventListener('click',()=>{let c=currentClass(),n=prompt('Nouveau nom de classe',c.name);if(n===null||!n.trim())return;if(db.classes.some(x=>x.id!==c.id&&x.name.toLowerCase()===n.trim().toLowerCase()))return alert('Nom déjà utilisé.');c.name=n.trim();save();render()});document.getElementById('deleteClass')?.addEventListener('click',()=>{if(db.classes.length<2)return alert('Conservez au moins une classe.');let c=currentClass(),count=classStudents().length,asc=classAscents().length;if(!confirm(`Supprimer ${c.name} et ses ${count} profils et ${asc} ascensions ? Cette opération est irréversible sans sauvegarde.`))return;let check=prompt('Pour confirmer, recopiez le nom exact de la classe :');if(check!==c.name)return alert('Suppression annulée.');let ids=new Set(classStudents().map(x=>x.id));db.students=db.students.filter(x=>!ids.has(x.id));db.ascents=db.ascents.filter(x=>x.classId!==c.id);ids.forEach(id=>delete db.skills[id]);delete db.sessionDates[c.id];db.classes=db.classes.filter(x=>x.id!==c.id);db.activeClassId=db.classes[0].id;studentId='';save();render()});document.getElementById('activeSession')?.addEventListener('change',e=>{db.session=Number(e.target.value);save();render()});document.querySelectorAll('.sessionDate').forEach(e=>e.addEventListener('change',()=>{db.sessionDates[db.activeClassId]??={};db.sessionDates[db.activeClassId][e.dataset.session]=e.value;save()}));document.getElementById('categoryForm')?.addEventListener('submit',e=>{e.preventDefault();let n=new FormData(e.target).get('category').trim();if(!n||db.skillCatalog[n])return alert('Catégorie invalide ou existante.');db.skillCatalog[n]=[];save();render()});document.getElementById('skillAddForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),n=f.get('label').trim();if(!n)return;db.skillCatalog[f.get('category')].push({id:uid(),label:n,visible:false});save();render()});document.querySelectorAll('[data-toggleskill]').forEach(b=>b.onclick=()=>{for(const items of Object.values(db.skillCatalog)){const item=items.find(x=>x.id===b.dataset.toggleskill);if(item){item.visible=item.visible===false;save();render();return}}});document.querySelectorAll('[data-editskill]').forEach(b=>b.onclick=()=>{for(let items of Object.values(db.skillCatalog)){let it=items.find(x=>x.id===b.dataset.editskill);if(it){let n=prompt('Modifier la compétence',it.label);if(n?.trim()){it.label=n.trim();save();render()}return}}});document.querySelectorAll('[data-deleteskill]').forEach(b=>b.onclick=()=>{for(let [k,items] of Object.entries(db.skillCatalog)){let it=items.find(x=>x.id===b.dataset.deleteskill);if(it&&confirm('Supprimer cette compétence du catalogue ? Les évaluations historiques seront conservées dans les sauvegardes.')){db.skillCatalog[k]=items.filter(x=>x.id!==it.id);save();render();return}}});document.querySelectorAll('[data-renamecategory]').forEach(b=>b.onclick=()=>{let k=b.dataset.renamecategory,n=prompt('Nom de la catégorie',k)?.trim();if(!n||n===k)return;if(db.skillCatalog[n])return alert('Catégorie existante.');db.skillCatalog=Object.fromEntries(Object.entries(db.skillCatalog).map(([key,v])=>[key===k?n:key,v]));save();render()});document.querySelectorAll('[data-deletecategory]').forEach(b=>b.onclick=()=>{let k=b.dataset.deletecategory;if(Object.keys(db.skillCatalog).length<2)return alert('Conservez au moins une catégorie.');if(!confirm(`Supprimer la catégorie « ${k} » et ses compétences ?`))return;delete db.skillCatalog[k];save();render()});document.getElementById('classSelect')?.addEventListener('change',e=>{db.activeClassId=e.target.value;studentId='';save();render()});document.getElementById('classForm')?.addEventListener('submit',e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;if(db.classes.some(c=>c.name.toLowerCase()===name.toLowerCase()))return alert('Cette classe existe déjà.');let id=uid();db.classes.push({id,name});db.activeClassId=id;studentId='';save();render()});document.getElementById('reportSession')?.addEventListener('change',e=>{db.reportSession=Number(e.target.value);save();document.getElementById('sessionReport').innerHTML=sessionReport(db.activeClassId,db.reportSession)});document.querySelectorAll('[data-editroute]').forEach(b=>b.onclick=()=>{let r=getRoute(b.dataset.editroute);if(!r)return;let sector=prompt('Secteur de '+r.id,r.sector);if(sector===null)return;let grade=prompt('Cotation (ex : 5A+)',r.grade);if(grade===null)return;grade=grade.trim().toUpperCase();if(!grades.includes(grade))return alert('Cotation invalide.');let color=prompt('Couleur',r.color);if(color===null)return;if(!sector.trim()||!color.trim())return alert('Champs obligatoires.');let old=r.grade;r.sector=sector.trim();r.grade=grade;r.color=color.trim();if(old!==grade){let affected=db.ascents.filter(a=>a.routeId===r.id);if(affected.length&&confirm('Mettre à jour la cotation des '+affected.length+' ascensions déjà enregistrées ? (Annuler = conserver les cotations historiques)'))affected.forEach(a=>a.grade=grade)}save();render()});document.getElementById('studentForm')?.addEventListener('submit',e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;db.students.push({id:uid(),name,classId:db.activeClassId});save();render()});document.getElementById('routeForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),id=f.get('id').trim().toUpperCase();if(db.routes.some(r=>r.id===id))return alert('Cet identifiant existe déjà : utiliser un nouvel identifiant pour une voie modifiée.');db.routes.push({id,grade:f.get('grade'),sector:f.get('sector').trim(),color:f.get('color').trim(),active:true});save();render()});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{let r=getRoute(b.dataset.route);r.active=!r.active;save();render()});document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>showSkills(b.dataset.student));document.getElementById('session')?.addEventListener('change',e=>{db.session=Number(e.target.value);save()});document.getElementById('export')?.addEventListener('click',()=>download('carnet-grimpe-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json'));document.getElementById('excel')?.addEventListener('click',exportExcel);document.getElementById('csv')?.addEventListener('click',()=>{let rows=[['classe','eleve','seance','date_seance','voie','secteur','cotation','resultat','repos','statut','date_saisie'],...db.ascents.map(a=>[db.classes.find(c=>c.id===a.classId)?.name||'',getStudent(a.studentId)?.name||'',a.session,db.sessionDates[a.classId]?.[a.session]||'',a.routeId,getRoute(a.routeId)?.sector||'',a.grade,outcomeName[a.outcome]||a.outcome,a.rests,a.status,a.createdAt])];download('ascensions.csv','\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')});document.getElementById('import')?.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.students)||!Array.isArray(d.routes)||!Array.isArray(d.ascents)||typeof d.skills!=='object')throw Error();if(!confirm('Remplacer toutes les données locales par cette sauvegarde ?'))return;db=d;if(!db.masteryScaleVersion){for(const rec of Object.values(db.skills||{}))for(const v of Object.values(rec||{})){if(typeof v.self==='number')v.self=({0:0,1:1,2:3,3:4})[v.self]??0;if(typeof v.teacher==='number')v.teacher=({0:0,1:1,2:3,3:4})[v.teacher]??0}db.masteryScaleVersion=2}db.skillCatalog??=defaultDomains();db.sessionDates??={};if(!Array.isArray(db.classes)||!db.classes.length){db.classes=[{id:'classe-1',name:'3e A'}];db.activeClassId='classe-1';db.students.forEach(x=>x.classId='classe-1');db.ascents.forEach(x=>x.classId='classe-1')}if(!db.classes.some(c=>c.id===db.activeClassId))db.activeClassId=db.classes[0].id;db.students.forEach(x=>x.classId??=db.classes[0].id);db.ascents.forEach(x=>x.classId??=db.students.find(s=>s.id===x.studentId)?.classId||db.classes[0].id);studentId='';save();render()}catch{alert('Fichier de sauvegarde invalide.')}});document.getElementById('lock')?.addEventListener('click',()=>{prof=false;render()})}

function sessionStats(cid,n){let a=db.ascents.filter(x=>x.classId===cid&&x.session===n&&x.status==='validated'),wins=a.filter(x=>x.outcome!=='attempt'),clean=a.filter(x=>x.outcome==='clean');return {total:a.length,attempt:a.length-wins.length,rest:wins.length-clean.length,clean:clean.length,top:wins.length?grades[Math.max(...wins.map(x=>gradeVal(x.grade)))]: '—',avg:gradeAvg(wins.map(x=>x.grade)),wins:wins.length}}
function sessionReport(cid,n){let x=sessionStats(cid,n);return `<div class="grid"><div><div class="muted">Voies tentées (validées)</div><div class="stat">${x.total}</div></div><div><div class="muted">Cotation maximale réussie</div><div class="stat">${x.top}</div></div><div><div class="muted">Cotation moyenne réussie</div><div class="stat">${x.avg}</div></div></div><div class="scroll"><table><thead><tr><th>Tentatives inachevées</th><th>Réussites avec repos</th><th>Réussites sans repos</th></tr></thead><tbody><tr><td>${x.attempt}</td><td>${x.rest}</td><td>${x.clean}</td></tr></tbody></table></div><div class="bar" style="display:flex;margin-top:12px">${x.total?`<span style="width:${100*x.attempt/x.total}%;background:#b8bfc3"></span><span style="width:${100*x.rest/x.total}%;background:#e3a553"></span><span style="width:${100*x.clean/x.total}%;background:#4eaa80"></span>`:''}</div><p class="muted tiny">Moyenne et maximum calculés sur les voies réussies (avec ou sans repos). Les ascensions en attente et rejetées sont exclues.</p>`}
function classChallenge(){let n=db.reportSession||db.session;return `<div class="scroll"><table><thead><tr><th>Classe</th><th>Dernière séance avec données validées</th><th>Voies tentées</th><th>Réussies</th><th>Cotation max réussie</th><th>Moyenne réussie</th></tr></thead><tbody>${db.classes.map(c=>{let sessions=db.ascents.filter(a=>a.classId===c.id&&a.status==='validated').map(a=>a.session);let last=sessions.length?Math.max(...sessions):null;let x=last?sessionStats(c.id,last):null;return `<tr><td>${esc(c.name)}</td><td>${last?'S'+last:'—'}</td><td>${x?.total??'—'}</td><td>${x?.wins??'—'}</td><td>${x?.top??'—'}</td><td>${x?.avg??'—'}</td></tr>`}).join('')}</tbody></table></div><p class="muted tiny">Attention : les volumes bruts dépendent des effectifs et du temps de grimpe. Une comparaison équitable pourra intégrer les ascensions par élève présent.</p>`}
function showSkills(id){let s=getStudent(id);let p=document.getElementById('skillPanel');if(!s||!p)return;p.innerHTML=`<h2>Compétences : ${esc(s.name)}</h2><p class="note">Le niveau « Maîtrisé » ne remplace pas la vérification réelle des procédures de sécurité avant toute autorisation d'assurer.</p>${Object.entries(db.skillCatalog).map(([d,items])=>`<details class="fold"><summary>${esc(d)}</summary>${items.map((item,i)=>{let k=item.id,v=db.skills[id]?.[k]||{};return `<div class="row" style="margin-bottom:10px"><span style="flex:2;min-width:210px">${esc(item.label)} <small class="muted">(auto : ${masteryNames[v.self||0]})</small></span><select class="teacherSkill mastery-${v.teacher||0}" data-key="${k}" style="flex:1;min-width:150px">${masteryNames.map((n,j)=>`<option value="${j}" ${v.teacher===j?'selected':''}>${n}</option>`).join('')}</select></div>`}).join('')}</details>`).join('')}`;p.querySelectorAll('.teacherSkill').forEach(e=>e.onchange=()=>{db.skills[id]??={};db.skills[id][e.dataset.key]??={};db.skills[id][e.dataset.key].teacher=Number(e.value);save()});p.scrollIntoView({behavior:'smooth',block:'start'})}function exportExcel(){
 const safe=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const sheet=(name,rows)=>'<Worksheet ss:Name="'+safe(name)+'"><Table>'+rows.map((row,i)=>'<Row>'+row.map(v=>'<Cell><Data ss:Type="'+(typeof v==='number'&&Number.isFinite(v)?'Number':'String')+'">'+safe(v)+'</Data></Cell>').join('')+'</Row>').join('')+'</Table></Worksheet>';
 const asc=[['Classe','Élève','Séance','Date séance','Voie','Secteur','Cotation','Résultat','Repos','Statut','Date saisie'],...db.ascents.map(a=>[db.classes.find(c=>c.id===a.classId)?.name||'',getStudent(a.studentId)?.name||'',a.session,db.sessionDates[a.classId]?.[a.session]||'',a.routeId,getRoute(a.routeId)?.sector||'',a.grade,outcomeName[a.outcome]||a.outcome,a.rests,a.status,a.createdAt])];
 const bilans=[['Classe','Séance','Date','Tentatives validées','Inachevées','Réussies avec repos','Réussies sans repos','Cotation max réussie','Cotation moyenne (indice)']];
 const bilansClasses=[['Classe','Tentatives validées','Inachevées','Réussies avec repos','Réussies sans repos','Cotation max réussie','Cotation moyenne (indice)']];
 function stats(arr){let attempts=arr.filter(a=>a.outcome==='attempt').length,rest=arr.filter(a=>a.outcome==='rest').length,clean=arr.filter(a=>a.outcome==='clean').length,success=arr.filter(a=>a.outcome!=='attempt');let values=success.map(a=>gradeVal(a.grade)).filter(v=>v>=0);return [arr.length,attempts,rest,clean,values.length?grades[Math.max(...values)]:'',values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length*100)/100:''];}
 for(const c of db.classes){let all=db.ascents.filter(a=>a.classId===c.id&&a.status==='validated');bilansClasses.push([c.name,...stats(all)]);for(let n=1;n<=8;n++){let entries=all.filter(a=>Number(a.session)===n);bilans.push([c.name,n,db.sessionDates[c.id]?.[n]||'',...stats(entries)])}}
 const comps=[['Classe','Élève','Catégorie','Compétence','Visible élève','Autoévaluation','Évaluation professeur']];for(const st of db.students){for(const [cat,items] of Object.entries(db.skillCatalog)){for(const it of items){const val=db.skills[st.id]?.[it.id]||{};comps.push([db.classes.find(c=>c.id===st.classId)?.name||'',st.name,cat,it.label,it.visible===false?'Non':'Oui',masteryNames[val.self||0],masteryNames[val.teacher||0]])}}}
 const voies=[['Identifiant','Secteur','Cotation','Couleur','Active'],...db.routes.map(r=>[r.id,r.sector,r.grade,r.color,r.active?'Oui':'Non'])];
 const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+sheet('Ascensions',asc)+sheet('Bilans séances',bilans)+sheet('Bilans classes',bilansClasses)+sheet('Compétences',comps)+sheet('Voies',voies)+'</Workbook>';
 download('carnet-grimpe-excel-'+new Date().toISOString().slice(0,10)+'.xml','\ufeff'+xml,'application/vnd.ms-excel');
