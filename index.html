function foldCards(){document.querySelectorAll('#content section.card').forEach(card=>{const h=card.querySelector(':scope > h2, :scope > h3');if(!h||/Mon carnet|Classe active|Enregistrer une ascension|Compétences :|Accès professeur/.test(h.textContent))return;const detail=document.createElement('details');detail.className='fold';detail.dataset.foldId=tab+'|'+db.activeClassId+'|'+(tab==='eleve'?studentId:'prof')+'|panel|'+h.textContent.replace(/\s*\(\d+\)\s*$/,'').trim();detail.open=/Séance active|Ascensions à valider/.test(h.textContent);const summary=document.createElement('summary');summary.textContent=h.textContent;detail.append(summary);h.remove();while(card.firstChild)detail.append(card.firstChild);card.append(detail)})}
// Preserve the open state by stable DOM position, independent of move-button labels.
// Remember each fold by its identity rather than its position: changing a filter can
// change the number/order of generated details, and moving panels changes DOM order.
// Stable panel identifiers: content changes (counts, mastery, filters) never reset a fold.
const foldMemory=new Map();
function foldKey(d){
 if(d.dataset.foldId)return d.dataset.foldId;
 if(d.id)return 'id:'+d.id;
 const card=d.closest('section.card');
 const root=[...document.querySelectorAll('#content section.card')].indexOf(card);
 const label=(d.querySelector(':scope > summary')?.textContent||'').replace(/[↑↓]/g,'').replace(/\s*\(\d+\)\s*$/,'').trim();
 const context=(card?.dataset.panelKey||card?.dataset.panelId||String(root));
 return tab+'|'+db.activeClassId+'|'+(tab==='eleve'?studentId:'prof')+'|'+context+'|'+label;
}
function captureFolds(){document.querySelectorAll('#content details').forEach(d=>foldMemory.set(foldKey(d),d.open));}
function restoreFolds(){document.querySelectorAll('#content details').forEach(d=>{const key=foldKey(d);d.dataset.foldId=key;if(foldMemory.has(key))d.open=foldMemory.get(key);d.addEventListener('toggle',()=>{foldMemory.set(key,d.open)});});}
const sections={
 'Mon carnet':'classe','Classe active':'classe','Enregistrer une ascension':'voies',
 'Historique':'historique','Mes compétences':'competences','Catalogue des compétences':'competences',
 'Évaluation professeur':'competences','Bilan de séance':'bilan','Défi interclasses':'bilan',
 'Validation des ascensions':'validation','Profils élèves':'classe','Catalogue des voies':'voies',
 'Réglages et sauvegardes':'donnees','Séance active':'progression','MON PROFIL':'titres',
 'Accès professeur':'donnees'
};
function decoratePanels(){
 document.querySelectorAll('#content section.card').forEach((card,i)=>{
  const title=(card.querySelector(':scope > h2,:scope > h3,:scope > details > summary')?.textContent||'');
  let type=Object.entries(sections).find(([name])=>title.includes(name))?.[1];
  if(card.classList.contains('title-profile'))type='titres';
  if(type)card.dataset.section=type;
  card.dataset.panelId ||= 'panel-'+i;
 });
}
function render(){
 captureFolds();
 document.getElementById('modeLabel').textContent=prof?'Mode professeur déverrouillé':'Mode élève';
 el.innerHTML=tab==='eleve'?studentView():prof?teacherView():loginView();
 foldCards();decoratePanels();restoreFolds();bind();colorizeSkillSelects();setupRestInput();
 if(prof&&tab==='prof')setupTeacherOrder();
}
function setupRestInput(){const outcome=document.getElementById('outcome'),rests=document.getElementById('restsInput');if(!outcome||!rests)return;function sync(){const clean=outcome.value==='clean';if(clean)rests.value=0;rests.disabled=clean;rests.title=clean?'Une réussite sans repos implique zéro repos':''}outcome.addEventListener('change',sync);sync()}
function setupTeacherOrder(){
 const root=document.getElementById('content');
 const nodes=[...root.children].filter(n=>n.matches('section.card,div.grid'));
 if(!nodes.length)return;
 // Each grid is treated as one indivisible panel, so its tiles cannot spill into other panels.
 nodes.forEach((node,i)=>{
   if(node.matches('div.grid')){
     const wrap=document.createElement('section');wrap.className='teacherGroup';
     node.before(wrap);wrap.appendChild(node);
     wrap.dataset.panelKey=i===5?'indicateurs':i===7?'profils-voies':'groupe-'+i;
   }else{
     const h=node.querySelector(':scope > h2');
     node.dataset.panelKey=node.id||'p-'+i;
     if(h)h.classList.add('teacherPanelTitle');
   }
 });
 const panels=[...root.children].filter(n=>n.dataset.panelKey);
 db.teacherPanelOrder??=[];
 panels.sort((a,b)=>{
   const ai=db.teacherPanelOrder.indexOf(a.dataset.panelKey),bi=db.teacherPanelOrder.indexOf(b.dataset.panelKey);
   return (ai<0?999:ai)-(bi<0?999:bi);
 }).forEach(n=>root.appendChild(n));
 const labels={'indicateurs':'📊 Indicateurs','profils-voies':'👥 Profils et voies'};
 function refresh(){
   const ordered=[...root.children].filter(n=>n.dataset.panelKey);
   ordered.forEach((node,i)=>{
     let heading=node.querySelector(':scope > h2');
     if(!heading){heading=node.querySelector(':scope > .teacherGroupHeading');
       if(!heading){heading=document.createElement('div');heading.className='teacherGroupHeading';node.prepend(heading)}
       const summary=node.querySelector('details.fold > summary');
       if(summary){heading.classList.add('visuallyHiddenPanel');heading.textContent='';}
       else heading.textContent=labels[node.dataset.panelKey]||'Gestion';
     }
     heading.classList.add('teacherPanelTitle');
     const summary=node.querySelector('details.fold > summary');if(summary){heading.classList.add('visuallyHiddenPanel');heading=summary;heading.classList.add('teacherPanelTitle')}let controls=heading.querySelector('.panelControls');
     if(!controls){controls=document.createElement('span');controls.className='panelControls';heading.appendChild(controls)}
     controls.replaceChildren();
     const up=document.createElement('button');up.type='button';up.textContent='↑';up.title='Monter ce volet';up.setAttribute('aria-label','Monter ce volet');up.disabled=i===0;
     const down=document.createElement('button');down.type='button';down.textContent='↓';down.title='Descendre ce volet';down.setAttribute('aria-label','Descendre ce volet');down.disabled=i===ordered.length-1;
     up.onclick=()=>move(node,-1);down.onclick=()=>move(node,1);
     controls.append(up,down);
     if(heading.tagName==='SUMMARY')for(const b of [up,down])b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});
   });
 }
 function move(node,d){
   const ordered=[...root.children].filter(n=>n.dataset.panelKey);
   const i=ordered.indexOf(node),target=ordered[i+d];if(!target)return;
   if(d<0)root.insertBefore(node,target);else root.insertBefore(target,node);
   db.teacherPanelOrder=[...root.children].filter(n=>n.dataset.panelKey).map(n=>n.dataset.panelKey);
   save();refresh();
 }
 refresh();
}

function earnedTitles(id,extra=[]){
 const valid=db.ascents.filter(a=>a.studentId===id&&a.status==='validated').concat(extra);

}
function equippedTitle(student){

function openAscentWizard(editId=null){
 const existing=editId?db.ascents.find(a=>a.id===editId&&a.studentId===studentId&&a.classId===db.activeClassId&&a.status==='pending'):null;
 if(editId&&!existing)return alert('Seules tes ascensions en attente peuvent être modifiées.');
 if(!studentId||!getStudent(studentId))return;
 const routes=db.routes.filter(r=>r.active||(existing&&r.id===existing.routeId));
 const sectors=[...new Set(routes.map(r=>r.sector))].sort((a,b)=>a.localeCompare(b,'fr',{sensitivity:'base',numeric:true}));
 if(!sectors.length)return alert('Aucune voie disponible.');
 const state={step:0,sector:existing?getRoute(existing.routeId)?.sector||'':'',routeId:existing?.routeId||'',outcome:existing?.outcome||'',rests:existing?.rests||0};
 const colorCode=color=>{const s=String(color||'').toLowerCase();return /vert/.test(s)?'#32a269':/bleu/.test(s)?'#3487d3':/rouge/.test(s)?'#d84b50':/jaune/.test(s)?'#e9c53d':/orange/.test(s)?'#e88b32':/violet|mauve/.test(s)?'#9564bb':/rose/.test(s)?'#ed83ad':/noir/.test(s)?'#353e43':/blanc/.test(s)?'#f4f4f4':'#91a9a0'};
 const layer=document.createElement('div');layer.className='route-wizard-overlay';
 const close=()=>{document.removeEventListener('keydown',escKey);layer.remove();};
 function escKey(ev){if(ev.key==='Escape')close();}
 document.addEventListener('keydown',escKey);
 document.body.append(layer);
 function draw(){
  const title=['1. Choisis ton secteur','2. Choisis ta voie','3. Décris ton ascension'][state.step];

   <div class="wizard-steps" aria-label="Étape ${state.step+1} sur 3">${[0,1,2].map(i=>`<span class="${i<=state.step?'done':''}"></span>`).join('')}</div>
   <h2>${title}</h2>
   ${state.step===0?`<p class="wizard-lead">Dans quel secteur as-tu grimpé ?</p><div class="wizard-options sector-options">${sectors.map(sec=>`<button type="button" class="sector-choice" data-sector="${esc(sec)}" aria-label="Choisir le secteur ${esc(sec)}"><span class="sector-eyebrow">SECTEUR</span><span class="sector-name">${esc(String(sec).replace(/^secteur\s+/i,''))}</span></button>`).join('')}</div>`:''}
   ${state.step===1?`<div class="wizard-location">📍 Secteur ${esc(String(state.sector).replace(/^secteur\s+/i,''))}</div><div class="wizard-options">${available.map(r=>`<button type="button" class="route-choice" data-choice="${esc(r.id)}" aria-label="Voie ${esc(r.color)}, ${esc(r.grade)}"><span class="color-dot" style="--route-color:${colorCode(r.color)}" aria-hidden="true"></span><span class="choice-text"><span class="choice-name">${esc(r.color)}</span><span class="choice-grade">${esc(r.grade)}</span></span></button>`).join('')}</div>${available.length?'':'<p>Aucune voie active ici.</p>'}`:''}
   ${state.step===2?`<div class="wizard-summary">📍 ${esc(state.sector)} · ${esc(currentRoute?.color)} · ${esc(currentRoute?.grade)}</div><form id="wizardForm">
    <div class="field"><strong>Quel est ton résultat ?</strong><div class="outcome-options">
      ${[['clean','✅','Réussie sans repos'],['rest','🟡','Réussie avec repos'],['attempt','🔄','Tentative inachevée']].map(([value,icon,label])=>`<label class="outcome-choice"><input type="radio" name="outcome" value="${value}" ${state.outcome===value?'checked':''} required><span>${icon} ${label}</span></label>`).join('')}
    </div></div>
    <div class="field" id="wizardRestsField" hidden><label for="wizardRests">Combien de repos sur corde ?</label><input id="wizardRests" name="rests" type="number" min="1" max="30" value="${Math.max(1,state.rests||1)}"></div>
    <button class="primary" type="submit">${editId?'Enregistrer les modifications':'Envoyer pour validation'}</button></form>`:''}
   <div class="wizard-actions">${state.step>0?'<button id="wizardBack" type="button">← Retour</button>':'<span></span>'}<button id="wizardCancel" type="button" class="wizard-close">Annuler</button></div>
  </div>`;
  layer.querySelector('#wizardClose').onclick=close;layer.querySelector('#wizardCancel').onclick=close;
  layer.querySelector('#wizardBack')?.addEventListener('click',()=>{if(state.step===2){state.outcome=layer.querySelector('input[name=outcome]:checked')?.value||'';state.rests=Number(layer.querySelector('#wizardRests').value)}state.step--;draw()});
  layer.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{state.sector=b.dataset.sector;state.routeId='';state.step=1;draw()});
  layer.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.routeId=b.dataset.choice;state.step=2;draw()});
  const outcomeRadios=layer.querySelectorAll('input[name=outcome]'),rests=layer.querySelector('#wizardRests'),restsField=layer.querySelector('#wizardRestsField');
  if(outcomeRadios.length){const sync=()=>{const value=layer.querySelector('input[name=outcome]:checked')?.value;restsField.hidden=value!=='rest';rests.disabled=value!=='rest';rests.required=value==='rest';};outcomeRadios.forEach(r=>r.addEventListener('change',sync));sync();}
  layer.querySelector('#wizardForm')?.addEventListener('submit',ev=>{
   ev.preventDefault();const r=routes.find(r=>r.id===state.routeId);if(!r)return;

  });

 layer.addEventListener('click',ev=>{if(ev.target===layer)close()});draw();

// V18: professor's route catalog is grouped by sector; identifiers remain technical metadata.
function teacherRouteCatalog(){
 const groups=new Map();
 for(const r of db.routes){
   const sector=String(r.sector||'Sans secteur').trim()||'Sans secteur';
   if(!groups.has(sector))groups.set(sector,[]);
   groups.get(sector).push(r);
 }
 if(!groups.size)return `<p class="muted">Aucune voie enregistrée. Utilisez le formulaire ci-dessus.</p>`;
 const cmp=(a,b)=>String(a).localeCompare(String(b),'fr',{numeric:true,sensitivity:'base'});
 return [...groups.entries()].sort((a,b)=>cmp(a[0],b[0])).map(([sector,routes],index)=>{
   routes.sort((a,b)=>cmp(a.color,b.color)||gradeVal(a.grade)-gradeVal(b.grade)||cmp(a.id,b.id));
   const active=routes.filter(r=>r.active).length;
   const key='catalogue-secteur|'+encodeURIComponent(sector);
   return `<details class="fold sector-fold" data-fold-id="${esc(key)}" ${index===0?'open':''}>
     <summary><span class="sector-heading">📍 Secteur ${esc(sector)}</span><span class="sector-count">${routes.length} voie${routes.length>1?'s':''} · ${active} active${active>1?'s':''}</span></summary>
     <div class="sector-route-list">${routes.map(r=>`<div class="sector-route ${r.active?'':'route-archived'}">
       <div class="sector-route-info"><span class="route-color">${esc(r.color)}</span><span class="route-grade-pill">${esc(r.grade)}</span><small class="route-technical">ID : ${esc(r.id)}</small>${r.active?'':'<span class="route-archived-label">Archivée</span>'}</div>
       <div class="sector-route-actions"><button type="button" data-editroute="${esc(r.id)}">Modifier</button><button type="button" data-route="${esc(r.id)}">${r.active?'Archiver':'Réactiver'}</button></div>
     </div>`).join('')}</div>
   </details>`;
 }).join('');
}

function sessionStats(cid,n){let a=db.ascents.filter(x=>x.classId===cid&&x.session===n&&x.status==='validated'),wins=a.filter(x=>x.outcome!=='attempt'),clean=a.filter(x=>x.outcome==='clean');return {total:a.length,attempt:a.length-wins.length,rest:wins.length-clean.length,clean:clean.length,top:wins.length?grades[Math.max(...wins.map(x=>gradeVal(x.grade)))]: '—',avg:gradeAvg(wins.map(x=>x.grade)),wins:wins.length}}
function sessionReport(cid,n){let x=sessionStats(cid,n);return `<div class="grid"><div><div class="muted">Voies tentées (validées)</div><div class="stat">${x.total}</div></div><div><div class="muted">Cotation maximale réussie</div><div class="stat">${x.top}</div></div><div><div class="muted">Cotation moyenne réussie</div><div class="stat">${x.avg}</div></div></div><div class="scroll"><table><thead><tr><th>Tentatives inachevées</th><th>Réussites avec repos</th><th>Réussites sans repos</th></tr></thead><tbody><tr><td>${x.attempt}</td><td>${x.rest}</td><td>${x.clean}</td></tr></tbody></table></div><div class="bar" style="display:flex;margin-top:12px">${x.total?`<span style="width:${100*x.attempt/x.total}%;background:#b8bfc3"></span><span style="width:${100*x.rest/x.total}%;background:#e3a553"></span><span style="width:${100*x.clean/x.total}%;background:#4eaa80"></span>`:''}</div><p class="muted tiny">Moyenne et maximum calculés sur les voies réussies (avec ou sans repos). Les ascensions en attente et rejetées sont exclues.</p>`}
function classChallenge(){let n=db.reportSession||db.session;return `<div class="scroll"><table><thead><tr><th>Classe</th><th>Dernière séance avec données validées</th><th>Voies tentées</th><th>Réussies</th><th>Cotation max réussie</th><th>Moyenne réussie</th></tr></thead><tbody>${db.classes.map(c=>{let sessions=db.ascents.filter(a=>a.classId===c.id&&a.status==='validated').map(a=>a.session);let last=sessions.length?Math.max(...sessions):null;let x=last?sessionStats(c.id,last):null;return `<tr><td>${esc(c.name)}</td><td>${last?'S'+last:'—'}</td><td>${x?.total??'—'}</td><td>${x?.wins??'—'}</td><td>${x?.top??'—'}</td><td>${x?.avg??'—'}</td></tr>`}).join('')}</tbody></table></div><p class="muted tiny">Attention : les volumes bruts dépendent des effectifs et du temps de grimpe. Une comparaison équitable pourra intégrer les ascensions par élève présent.</p>`}
function showSkills(id){let s=getStudent(id);let p=document.getElementById('skillPanel');if(!s||!p)return;p.innerHTML=`<h2>Compétences : ${esc(s.name)}</h2><p class="note">Le niveau « Maîtrisé » ne remplace pas la vérification réelle des procédures de sécurité avant toute autorisation d'assurer.</p>${Object.entries(db.skillCatalog).map(([d,items])=>`<details class="fold"><summary>${esc(d)}</summary>${items.map((item,i)=>{let k=item.id,v=db.skills[id]?.[k]||{};return `<div class="row" style="margin-bottom:10px"><span style="flex:2;min-width:210px">${esc(item.label)} <small class="muted">(auto : ${masteryNames[v.self||0]})</small></span><select class="teacherSkill mastery-${v.teacher||0}" data-key="${k}" style="flex:1;min-width:150px">${masteryNames.map((n,j)=>`<option value="${j}" ${v.teacher===j?'selected':''}>${n}</option>`).join('')}</select></div>`}).join('')}</details>`).join('')}`;p.querySelectorAll('.teacherSkill').forEach(e=>e.onchange=()=>{db.skills[id]??={};db.skills[id][e.dataset.key]??={};db.skills[id][e.dataset.key].teacher=Number(e.value);save()});p.scrollIntoView({behavior:'smooth',block:'start'})}function exportExcel(){
 const safe=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const sheet=(name,rows)=>'<Worksheet ss:Name="'+safe(name)+'"><Table>'+rows.map((row,i)=>'<Row>'+row.map(v=>'<Cell><Data ss:Type="'+(typeof v==='number'&&Number.isFinite(v)?'Number':'String')+'">'+safe(v)+'</Data></Cell>').join('')+'</Row>').join('')+'</Table></Worksheet>';
 const asc=[['Classe','Élève','Séance','Date séance','Voie','Secteur','Cotation','Résultat','Repos','Statut','Date saisie'],...db.ascents.map(a=>[db.classes.find(c=>c.id===a.classId)?.name||'',getStudent(a.studentId)?.name||'',a.session,db.sessionDates[a.classId]?.[a.session]||'',a.routeId,getRoute(a.routeId)?.sector||'',a.grade,outcomeName[a.outcome]||a.outcome,a.rests,a.status,a.createdAt])];
 const bilans=[['Classe','Séance','Date','Tentatives validées','Inachevées','Réussies avec repos','Réussies sans repos','Cotation max réussie','Cotation moyenne (indice)']];
 const bilansClasses=[['Classe','Tentatives validées','Inachevées','Réussies avec repos','Réussies sans repos','Cotation max réussie','Cotation moyenne (indice)']];
 function stats(arr){let attempts=arr.filter(a=>a.outcome==='attempt').length,rest=arr.filter(a=>a.outcome==='rest').length,clean=arr.filter(a=>a.outcome==='clean').length,success=arr.filter(a=>a.outcome!=='attempt');let values=success.map(a=>gradeVal(a.grade)).filter(v=>v>=0);return [arr.length,attempts,rest,clean,values.length?grades[Math.max(...values)]:'',values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length*100)/100:''];}
 for(const c of db.classes){let all=db.ascents.filter(a=>a.classId===c.id&&a.status==='validated');bilansClasses.push([c.name,...stats(all)]);for(let n=1;n<=8;n++){let entries=all.filter(a=>Number(a.session)===n);bilans.push([c.name,n,db.sessionDates[c.id]?.[n]||'',...stats(entries)])}}
 const comps=[['Classe','Élève','Catégorie','Compétence','Visible élève','Autoévaluation','Évaluation professeur']];for(const st of db.students){for(const [cat,items] of Object.entries(db.skillCatalog)){for(const it of items){const val=db.skills[st.id]?.[it.id]||{};comps.push([db.classes.find(c=>c.id===st.classId)?.name||'',st.name,cat,it.label,it.visible===false?'Non':'Oui',masteryNames[val.self||0],masteryNames[val.teacher||0]])}}}
 const voies=[['Identifiant','Secteur','Cotation','Couleur','Active'],...db.routes.map(r=>[r.id,r.sector,r.grade,r.color,r.active?'Oui':'Non'])];
 const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+sheet('Ascensions',asc)+sheet('Bilans séances',bilans)+sheet('Bilans classes',bilansClasses)+sheet('Compétences',comps)+sheet('Voies',voies)+'</Workbook>';
 download('carnet-grimpe-excel-'+new Date().toISOString().slice(0,10)+'.xml','\ufeff'+xml,'application/vnd.ms-excel');
}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script><script>if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(r=>r.update()).catch(console.warn)); }</script><div id="app-version" aria-label="Version de l’application" style="position:fixed;right:9px;bottom:7px;z-index:1000;font:11px system-ui,sans-serif;color:#4c6b60;background:#eef5f0e8;border:1px solid #cbded3;border-radius:10px;padding:3px 8px;pointer-events:none">Carnet de grimpe · V19</div></body></html>
